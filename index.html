<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b9d">
<meta name="description" content="A cinematic birthday experience. Gift, key, storybook, cake, candles, celebration, message, and a wish sent to the stars.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Birthday Experience">
<meta property="og:description" content="A cinematic birthday experience sent to the stars.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<style>
html{overflow-y:scroll}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f0f12;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,0.25);border-top-color:#ff6b9d;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<title>Birthday Experience</title>
</head>
<body>
<div id="loader"><div class="spinner"></div><div style="margin-top:12px;font-size:16px">Loading&hellip;</div></div>
<div id="rotate-gate" style="display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;background:#000;color:#fff;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);text-align:center"><div style="font-size:20px">Please rotate your phone to portrait</div><div style="margin-top:8px;opacity:.7">Portrait mode is required</div></div>
<canvas id="bg-canvas"></canvas>
<canvas id="fx-canvas"></canvas>
<div id="app">
<header class="chroma">
<button class="chip" id="mute-btn" aria-label="mute">Mute</button>
<button class="chip" id="theme-btn" aria-label="theme">Theme</button>
<button class="chip" id="mode-btn" aria-label="mode">Mode</button>
<button class="chip" id="skip-btn" aria-label="skip">Skip</button>
</header>
<div class="story-progress"><div id="progress-fill"></div><div id="progress-count">0 / 11</div></div>
<div id="stages">
<section id="stage-generator" data-stage="generator">
<form id="gen-form">
<label>Name</label><input id="gen-name" type="text" value="Alex">
<label>From</label><input id="gen-from" type="text" value="Someone">
<label>Message</label><textarea id="gen-msg">Happy Birthday!</textarea>
<label>Theme</label><select id="gen-theme"><option>sunrise</option><option>midnight</option><option>forest</option></select>
<label>DOB</label><input id="gen-dob" type="date">
</form>
<div id="gen-preview" class="glass-card">Preview</div>
<input id="gen-link" type="text" readonly>
<button id="gen-go" class="chip">Go</button>
<button id="gen-copy" class="chip">Copy link</button>
</section>
<section id="stage-gift" data-stage="gift">
<button id="gift-hit" class="svg-hit" aria-label="open gift">
<svg class="draw-svg gift-svg" viewBox="0 0 200 200" pathLength="1"><path class="draw" d="M50,150 L150,150 L150,50 L50,50 Z" fill="#e74c3c"/><path class="draw" d="M100,50 L100,150" stroke="#d35400" stroke-width="8" fill="none"/><path class="draw" d="M50,100 L150,100" stroke="#d35400" stroke-width="8" fill="none"/></svg>
</button>
</section>
<section id="stage-key" data-stage="key">
<button id="key-hit" class="svg-hit" aria-label="unlock key">
<svg class="draw-svg key-svg" viewBox="0 0 200 200" pathLength="1"><path class="draw" d="M100,150 L140,150 L140,130 L120,130" fill="#f1c40f"/><path class="draw" d="M140,140 Q150,150 150,160" fill="none" stroke="#b7950b" stroke-width="6"/></svg>
</button>
</section>
<section id="stage-storybook" data-stage="storybook">
<div id="book-wrap"><div id="book"></div></div>
</section>
<section id="stage-cake" data-stage="cake">
<div id="balloon-row"></div>
<div id="cake-display"></div>
<button id="cake-continue" class="chip">Continue</button>
</section>
<section id="stage-blow" data-stage="blow">
<div id="blow-prompt">Blow out the candles</div>
<div id="blow-display"></div>
<div id="blow-hint">Mic denied? Tap the flames</div>
<button id="blow-btn" class="chip">Blow</button>
</section>
<section id="stage-cut" data-stage="cut">
<div id="cut-prompt">Swipe across the cake to cut it</div>
<div class="cut-area" id="cut-area"><div id="cake-world"></div><canvas id="cut-canvas"></canvas></div>
<div id="cut-hint"></div>
<button id="cut-done" class="chip">Done</button>
</section>
<section id="stage-celebration" data-stage="celebration">
<h1 id="wave-title">Happy Birthday</h1>
<p id="cele-sub">Celebrate!</p>
<button id="cele-continue" class="chip">Continue</button>
</section>
<section id="stage-message" data-stage="message">
<p id="typed-msg"></p>
<p id="age-line"></p>
<h2 class="sec-title">Hall of Fame</h2>
<div class="fame-grid" id="fame-grid"></div>
<h2 class="sec-title">Timeline</h2>
<div class="timeline" id="timeline"></div>
<button id="msg-continue" class="chip">Continue</button>
</section>
<section id="stage-wish" data-stage="wish">
<canvas id="sky-canvas"></canvas>
<div id="star-buttons"></div>
<div id="wish-ui">
<label>Make a wish. The universe is listening.</label>
<textarea id="wish-text"></textarea>
<div id="wish-count">0 / 140</div>
<div id="wish-status"></div>
<div class="fineprint">Stars are saved on this device only.</div>
<button id="wish-send" class="chip">Send</button>
<button id="wish-continue" class="chip">Continue</button>
</div>
<div class="sheet" id="wish-sheet"><p id="sheet-text"></p><button id="sheet-delete" class="chip">Delete</button><button id="sheet-close" class="chip">Close</button></div>
</section>
<section id="stage-finale" data-stage="finale">
<div class="finale-card"><svg class="floral" viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="#ff6b9d" stroke-width="2"/></svg>
<p id="final-wish"></p>
<p id="final-from"></p>
<input id="final-link" type="text" readonly>
<button id="final-copy" class="chip">Copy link</button>
<button id="final-replay" class="chip">Replay</button>
</div>
</section>
</div>
<div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
